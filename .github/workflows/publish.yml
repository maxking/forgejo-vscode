name: Publish Extension

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install publishing tools
        run: npm install --global @vscode/vsce ovsx

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if echo "$VERSION" | grep -q -- '-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Publishing pre-release version: $VERSION"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Publishing stable version: $VERSION"
          fi

      - name: Package extension
        run: npm run package

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ "${{ steps.get_version.outputs.is_prerelease }}" = "true" ]; then
            echo "Publishing as pre-release..."
            vsce publish --pre-release -p "$VSCE_PAT" --baseContentUrl https://codeberg.org/maxking/forgejo-vscode/raw/branch/master --baseImagesUrl https://codeberg.org/maxking/forgejo-vscode/raw/branch/master
          else
            echo "Publishing as stable release..."
            vsce publish -p "$VSCE_PAT" --baseContentUrl https://codeberg.org/maxking/forgejo-vscode/raw/branch/master --baseImagesUrl https://codeberg.org/maxking/forgejo-vscode/raw/branch/master
          fi

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: |
          vsce package --baseContentUrl https://codeberg.org/maxking/forgejo-vscode/raw/branch/master --baseImagesUrl https://codeberg.org/maxking/forgejo-vscode/raw/branch/master
          OVSX_VSIX=$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)
          if [ "${{ steps.get_version.outputs.is_prerelease }}" = "true" ]; then
            echo "Publishing to Open VSX as pre-release..."
            ovsx publish "$OVSX_VSIX" --pre-release -p "$OVSX_PAT"
          else
            echo "Publishing to Open VSX as stable release..."
            ovsx publish "$OVSX_VSIX" -p "$OVSX_PAT"
          fi
          git restore package.json package-lock.json

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: forgejo-vscode-${{ steps.get_version.outputs.version }}.vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release ${{ steps.get_version.outputs.version }}" > "$NOTES_FILE"
          fi

          VSIX_FILE=$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)
          RELEASE_ARGS=(
            "$GITHUB_REF_NAME"
            "$VSIX_FILE"
            --verify-tag
            --title "v${{ steps.get_version.outputs.version }}"
            --notes-file "$NOTES_FILE"
          )
          if [ "${{ steps.get_version.outputs.is_prerelease }}" = "true" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"
