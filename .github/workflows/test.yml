name: Test

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_call:

permissions:
  contents: read

env:
  VSCODE_TEST_VERSION: 1.123.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit:coverage

      - name: Run integration tests
        run: xvfb-run -a npm run test:integration

  # ESLint 10 requires Node >= 20.19, so linting runs outside the Node 18/20
  # test matrix (Node 18 is kept there to cover the VS Code 1.85 runtime).
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # npm audit only needs the lockfile, not an installed node_modules tree.
      # Production dependencies ship inside the VSIX, so any vulnerability there blocks.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=low

      # Dev-tooling vulnerabilities never reach users; surface them in the log
      # without failing the build.
      - name: Audit all dependencies (informational)
        run: npm audit || true

  live-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        forgejo-version: ['11', '12', '13']

    services:
      forgejo:
        image: codeberg.org/forgejo/forgejo:${{ matrix.forgejo-version }}
        ports:
          - 3000:3000
        env:
          FORGEJO__security__INSTALL_LOCK: "true"
          FORGEJO__server__ROOT_URL: "http://localhost:3000"
          FORGEJO__database__DB_TYPE: sqlite3
          FORGEJO__service__DISABLE_REGISTRATION: "false"
          FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"

    env:
      FORGEJO_TEST_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install live-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install dependencies
        run: npm ci

      - name: Wait for Forgejo and set up test data
        run: bash scripts/setup-forgejo-test.sh

      - name: Run live integration tests
        run: npm run test:live

      # API compatibility is covered across the full Forgejo matrix above.
      # Run the expensive VS Code UI smoke suite only once, against the newest version.
      - name: Cache Playwright and VS Code downloads
        if: matrix.forgejo-version == '13'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            .vscode-test
          key: ${{ runner.os }}-vscode-${{ env.VSCODE_TEST_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        if: matrix.forgejo-version == '13'
        run: npx playwright install --with-deps chromium

      - name: Create test workspace for Playwright
        if: matrix.forgejo-version == '13'
        run: |
          mkdir -p /tmp/forgejo-test-workspace
          cd /tmp/forgejo-test-workspace
          git init
          git remote add origin http://localhost:3000/testuser/test-repo.git

      - name: Compile extension
        if: matrix.forgejo-version == '13'
        run: npm run compile

      - name: Run Playwright VS Code live tests
        if: matrix.forgejo-version == '13'
        run: xvfb-run -a npm run test:e2e:live
        env:
          FORGEJO_LIVE_WORKSPACE: /tmp/forgejo-test-workspace

  smoke-test-vsix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package and verify .vsix contents
        run: |
          npm run package
          VSIX=$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)
          if [ -z "$VSIX" ]; then
            echo "ERROR: No .vsix file found after packaging"
            exit 1
          fi
          echo "Checking .vsix: $VSIX"
          unzip -l "$VSIX" > /tmp/vsix-contents.txt

          check() {
            if grep -q "$1" /tmp/vsix-contents.txt; then
              echo "OK: $1"
            else
              echo "MISSING: $1"
              return 1
            fi
          }

          FAILED=0
          check "extension/out/extension.js" || FAILED=1
          check "extension/node_modules/forgejo-ts/package.json" || FAILED=1
          check "extension/node_modules/forgejo-ts/dist/index.js" || FAILED=1
          check "extension/package.json" || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "Full .vsix contents:"
            cat /tmp/vsix-contents.txt
            exit 1
          fi
          echo "All required files present in .vsix"
