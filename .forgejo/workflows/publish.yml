name: Publish Extension

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node-version: ['18', '20']

    runs-on: docker
    container: node:${{ matrix.node-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install xvfb and dependencies
      run: |
        apt-get update
        apt-get install -y xvfb libgtk-3-0 libxss1 libasound2 libgbm1 libnspr4 libnss3

    - name: Cache npm download cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit:coverage

    - name: Run integration tests
      run: |
        npm run compile
        xvfb-run -a npm run test:integration

  build-live-test-image:
    runs-on: docker
    env:
      LIVE_TEST_IMAGE: forgejo-vscode-live-test-node20:${{ github.sha }}
    steps:
    - uses: actions/checkout@v4

    - name: Build live-test image
      run: docker build -f .forgejo/ci/live-test-node20.Dockerfile -t "$LIVE_TEST_IMAGE" .

  live-test:
    needs: build-live-test-image
    strategy:
      matrix:
        forgejo-version: ['11', '12', '13']

    runs-on: docker
    container: forgejo-vscode-live-test-node20:${{ github.sha }}

    services:
      forgejo:
        image: codeberg.org/forgejo/forgejo:${{ matrix.forgejo-version }}
        env:
          FORGEJO__security__INSTALL_LOCK: "true"
          FORGEJO__server__ROOT_URL: "http://forgejo:3000"
          FORGEJO__database__DB_TYPE: sqlite3
          FORGEJO__service__DISABLE_REGISTRATION: "false"
          FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"

    env:
      FORGEJO_TEST_URL: http://forgejo:3000

    steps:
    - uses: actions/checkout@v4

    - name: Cache npm download cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      run: |
        command -v jq
        command -v curl
        command -v xvfb-run
        npm ci

    - name: Wait for Forgejo & setup test data
      run: bash scripts/setup-forgejo-test.sh

    - name: Run live integration tests
      run: npm run test:live

    # API compatibility is covered across the full Forgejo matrix above.
    # Run the expensive VS Code UI smoke suite only once, against the newest version.
    - name: Create test workspace for Playwright
      if: matrix.forgejo-version == '13'
      run: |
        mkdir -p /tmp/forgejo-test-workspace
        cd /tmp/forgejo-test-workspace
        git init
        git remote add origin http://forgejo:3000/testuser/test-repo.git

    - name: Compile extension
      if: matrix.forgejo-version == '13'
      run: npm run compile

    # The live-test Docker image pre-downloads VS Code to /opt/vscode-test.
    # Symlink it to the path @mshanemc/vscode-test-playwright looks at
    # (process.cwd()/.vscode-test/worker-0) so the 241 MB download is skipped.
    - name: Use pre-baked VS Code install
      if: matrix.forgejo-version == '13'
      run: ln -sfn /opt/vscode-test .vscode-test

    - name: Run Playwright VS Code live tests
      if: matrix.forgejo-version == '13'
      run: xvfb-run -a npm run test:e2e:live
      env:
        FORGEJO_LIVE_WORKSPACE: /tmp/forgejo-test-workspace

  smoke-test-vsix:
    runs-on: docker
    container: node:20

    steps:
    - uses: actions/checkout@v4

    - name: Cache npm download cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      run: npm ci

    - name: Package and verify .vsix contents
      run: |
        npm run package
        VSIX=$(ls -t *.vsix 2>/dev/null | head -1)
        if [ -z "$VSIX" ]; then
          echo "ERROR: No .vsix file found after packaging"
          exit 1
        fi
        echo "Checking .vsix: $VSIX"
        unzip -l "$VSIX" > /tmp/vsix-contents.txt

        check() {
          if grep -q "$1" /tmp/vsix-contents.txt; then
            echo "OK: $1"
          else
            echo "MISSING: $1"
            return 1
          fi
        }

        FAILED=0
        check "extension/out/extension.js" || FAILED=1
        check "extension/node_modules/forgejo-ts/package.json" || FAILED=1
        check "extension/node_modules/forgejo-ts/dist/index.js" || FAILED=1
        check "extension/package.json" || FAILED=1

        if [ "$FAILED" -ne 0 ]; then
          echo "--- Full .vsix contents ---"
          cat /tmp/vsix-contents.txt
          exit 1
        fi
        echo "All required files present in .vsix"

  publish:
    needs: [test, live-test, smoke-test-vsix]
    runs-on: docker
    container: node:20

    steps:
    - uses: actions/checkout@v4

    - name: Cache npm download cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y jq
        npm ci

    - name: Install vsce and ovsx
      run: npm install -g @vscode/vsce ovsx

    - name: Get version from tag
      id: get_version
      run: |
        # Remove 'v' prefix if present
        VERSION=${GITHUB_REF#refs/tags/}
        VERSION=${VERSION#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        # Detect semver pre-release versions (alpha, beta, rc, etc.).
        if echo "$VERSION" | grep -q -- '-'; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
          echo "Publishing pre-release version: $VERSION"
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
          echo "Publishing stable version: $VERSION"
        fi

    - name: Package extension
      run: npm run package

    - name: Publish to VS Code Marketplace
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: |
        if [ "${{ steps.get_version.outputs.is_prerelease }}" = "true" ]; then
          echo "Publishing as pre-release..."
          vsce publish --pre-release -p $VSCE_PAT --baseContentUrl https://raw.githubusercontent.com/maxking/forgejo-vscode/master --baseImagesUrl https://raw.githubusercontent.com/maxking/forgejo-vscode/master
        else
          echo "Publishing as stable release..."
          vsce publish -p $VSCE_PAT --baseContentUrl https://raw.githubusercontent.com/maxking/forgejo-vscode/master --baseImagesUrl https://raw.githubusercontent.com/maxking/forgejo-vscode/master
        fi

    - name: Publish to Open VSX Registry
      env:
        OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
      run: |
        # Open VSX uses publisher 'abhilashraj' - repackage with correct publisher
        vsce package --baseContentUrl https://raw.githubusercontent.com/maxking/forgejo-vscode/master --baseImagesUrl https://raw.githubusercontent.com/maxking/forgejo-vscode/master
        OVSX_VSIX=$(ls -t *.vsix | head -1)
        if [ "${{ steps.get_version.outputs.is_prerelease }}" = "true" ]; then
          echo "Publishing to Open VSX as pre-release..."
          ovsx publish "$OVSX_VSIX" --pre-release -p $OVSX_PAT
        else
          echo "Publishing to Open VSX as stable release..."
          ovsx publish "$OVSX_VSIX" -p $OVSX_PAT
        fi
        # Restore original package metadata changed during pre-release normalization/package steps.
        git checkout package.json package-lock.json

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v3
      with:
        name: forgejo-vscode-${{ steps.get_version.outputs.version }}.vsix
        path: '*.vsix'
        retention-days: 90

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Extract release notes from tag annotation if available
        TAG_MESSAGE=$(git tag -l --format='%(contents)' ${GITHUB_REF#refs/tags/})
        if [ -z "$TAG_MESSAGE" ]; then
          TAG_MESSAGE="Release ${{ steps.get_version.outputs.version }}"
        fi

        # Create release using Forgejo API
        VSIX_FILE=$(ls *.vsix)

        # Create the release
        IS_PRERELEASE="${{ steps.get_version.outputs.is_prerelease }}"
        PRERELEASE_FLAG="false"
        if [ "$IS_PRERELEASE" = "true" ]; then
          PRERELEASE_FLAG="true"
        fi

        # Build JSON payload safely using jq to handle special characters in TAG_MESSAGE
        JSON_PAYLOAD=$(jq -n \
          --arg tag "${GITHUB_REF#refs/tags/}" \
          --arg name "v${{ steps.get_version.outputs.version }}" \
          --arg body "$TAG_MESSAGE" \
          --argjson prerelease "$PRERELEASE_FLAG" \
          '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $prerelease}')

        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d "$JSON_PAYLOAD")
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        if [ "$HTTP_CODE" -ne 201 ]; then
          echo "Failed to create Forgejo release: HTTP $HTTP_CODE"
          echo "$RESPONSE" | head -n -1
          exit 1
        fi
        echo "Release created successfully"
